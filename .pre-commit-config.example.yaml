# Exemplo de configuração pre-commit para Portal PGE
# Para usar:
#   1. Instale: pip install pre-commit
#   2. Renomeie para .pre-commit-config.yaml
#   3. Execute: pre-commit install

repos:
  # Formatação e linting básico
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  # Python formatting
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3.12
        args: ['--line-length=100']

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 6.0.0
    hooks:
      - id: isort
        args: ['--profile', 'black', '--line-length', '100']

  # Linting
  - repo: https://github.com/pycqa/flake8
    rev: 8.1.1
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: ['--ignore-missing-imports', '--no-strict-optional']
        files: ^app/

  # Security
  - repo: https://github.com/PyCQA/bandit
    rev: '1.7.10'
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']

  # Architecture boundaries (custom)
  - repo: local
    hooks:
      - id: check-boundaries
        name: Check Architecture Boundaries
        entry: python scripts/check_boundaries.py
        language: system
        pass_filenames: false
        types: [python]
        # Apenas arquivos dentro de app/, services/, sistemas/, admin/
        files: ^(app|services|sistemas|admin)/.*\.py$

      - id: no-raw-torch-load
        name: No torch.load() direto
        entry: grep -n "torch.load(" --exclude-dir=utils --exclude=safe_torch.py
        language: system
        types: [python]
        files: ^(?!utils/safe_torch\.py$).*\.py$
        # Falha se encontrar (exit code 0 = encontrou, invertemos com ! no shell)
        pass_filenames: true

      - id: no-secrets
        name: No hardcoded secrets
        entry: python -c "import sys, re; sys.exit(1 if re.search(r'(password|secret|api_key)\s*=\s*[\"\\'](?!{{|%)', sys.stdin.read().lower()) else 0)"
        language: system
        types: [python]
        pass_filenames: false

# Configurações globais
default_install_hook_types: [pre-commit, pre-push]

# Pular alguns hooks em commits específicos
# git commit --no-verify (pula todos)
# SKIP=check-boundaries git commit (pula apenas este)
