# alembic.ini
# Configuracao do Alembic para migrations do Portal PGE-MS
#
# USO:
#   # Criar nova migration
#   alembic revision --autogenerate -m "descricao"
#
#   # Aplicar migrations pendentes
#   alembic upgrade head
#
#   # Ver historico
#   alembic history
#
#   # Rollback
#   alembic downgrade -1
#
# IMPORTANTE: A conexao com o banco e obtida de DATABASE_URL no .env

[alembic]
# Diretorio com scripts de migration
script_location = migrations

# Template para migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Trunca nome do arquivo em 60 caracteres
truncate_slug_length = 60

# Prepend to sys.path (projeto raiz)
prepend_sys_path = .

# Nome do arquivo de versao (deixa default)
version_path_separator = os

# Timezone para datas
# timezone =

# Output bonito
output_encoding = utf-8


[post_write_hooks]
# Hooks apos criar migration (ex: black para formatar)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
