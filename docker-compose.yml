# ============================================================
# Portal PGE-MS — Docker Compose
# ============================================================
# Uso:
#   DEV  (hot reload):  docker compose --profile dev up --build -d
#   PROD (otimizado):   docker compose --profile prod up --build -d
#
# Parar:                docker compose --profile dev down
# Parar + limpar BD:    docker compose --profile dev down -v
# Logs:                 docker compose --profile dev logs -f app
# ============================================================

services:
  # ---- Banco de Dados ----
  db:
    image: postgres:16-alpine
    profiles: [dev, prod]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: portal_pge
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"  # 5433 para evitar conflito com Postgres local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- App — Desenvolvimento ----
  app:
    build:
      context: .
      target: dev
    profiles: [dev]
    ports:
      - "8000:8000"
    volumes:
      - .:/app                              # Bind mount para hot reload
      - /app/__pycache__                    # Nao sobrescrever cache do container
      - /app/frontend-react/node_modules    # Protege node_modules do container
    environment:
      # Banco — aponta ao Postgres local do host (via host.docker.internal)
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:5432/portal_pge
      # JWT
      SECRET_KEY: "${SECRET_KEY:-dev-docker-secret-key-fallback}"
      ALGORITHM: "${ALGORITHM:-HS256}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-480}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin}"
      # TJ-MS (SOAP/MNI)
      TJ_WSDL_URL: "${TJ_WSDL_URL:-}"
      TJ_WS_USER: "${TJ_WS_USER:-}"
      TJ_WS_PASS: "${TJ_WS_PASS:-}"
      # TJ-MS (Playwright)
      TJMS_USUARIO: "${TJMS_USUARIO:-}"
      TJMS_SENHA: "${TJMS_SENHA:-}"
      # Gemini
      GEMINI_KEY: "${GEMINI_KEY:-}"
      # OpenRouter
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-google/gemini-3.6-flash}"
      FULL_REPORT_MODEL: "${FULL_REPORT_MODEL:-google/gemini-3.6-flash}"
      # GitHub / SuperMemory
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN:-}"
      SUPERMEMORY_API_KEY: "${SUPERMEMORY_API_KEY:-}"
      # Configuracoes opcionais
      DELAY_MIN: "${DELAY_MIN:-2.0}"
      DELAY_MAX: "${DELAY_MAX:-5.0}"
      MAX_TENTATIVAS: "${MAX_TENTATIVAS:-3}"
      HEADLESS: "${HEADLESS:-true}"
    depends_on:
      db:
        condition: service_healthy
    # Inicializa banco (cria tabelas se virgem) + hot reload
    command: >
      bash -c "
        echo '=== Portal PGE (dev) — Iniciando ===' &&
        python scripts/docker_init_db.py &&
        alembic upgrade head &&
        echo '=== Migrations OK — Subindo uvicorn com hot reload ===' &&
        uvicorn main:app --reload --host 0.0.0.0 --port 8000
      "

  # ---- App — Producao ----
  app-prod:
    build:
      context: .
      target: prod
    profiles: [prod]
    ports:
      - "8000:8000"
    environment:
      # Banco — aponta ao container db
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/portal_pge
      ENV: production
      # JWT
      SECRET_KEY: "${SECRET_KEY}"
      ALGORITHM: "${ALGORITHM:-HS256}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-480}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      # TJ-MS (SOAP/MNI)
      TJ_WSDL_URL: "${TJ_WSDL_URL:-}"
      TJ_WS_USER: "${TJ_WS_USER:-}"
      TJ_WS_PASS: "${TJ_WS_PASS:-}"
      # TJ-MS (Playwright)
      TJMS_USUARIO: "${TJMS_USUARIO:-}"
      TJMS_SENHA: "${TJMS_SENHA:-}"
      # Gemini
      GEMINI_KEY: "${GEMINI_KEY:-}"
      # OpenRouter
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-google/gemini-3.6-flash}"
      FULL_REPORT_MODEL: "${FULL_REPORT_MODEL:-google/gemini-3.6-flash}"
      # GitHub / SuperMemory
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN:-}"
      SUPERMEMORY_API_KEY: "${SUPERMEMORY_API_KEY:-}"
      # Configuracoes opcionais
      DELAY_MIN: "${DELAY_MIN:-2.0}"
      DELAY_MAX: "${DELAY_MAX:-5.0}"
      MAX_TENTATIVAS: "${MAX_TENTATIVAS:-3}"
      HEADLESS: "${HEADLESS:-true}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  pgdata:
