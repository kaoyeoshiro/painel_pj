[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-pge"
version = "1.0.0"
description = "Portal PGE-MS - Sistema de Procuradoria"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["services", "utils", "auth", "admin", "middleware", "database", "sistemas"]

[tool.pytest.ini_options]
# Adiciona o diretório raiz ao PYTHONPATH para imports
pythonpath = ["."]

# Diretório de testes
testpaths = ["tests"]

# Modo asyncio
asyncio_mode = "auto"

# Padrões de arquivos
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Opções padrão
addopts = "-v --tb=short"

# Filtros de warnings
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

# Markers customizados
markers = [
    "integration: Testes de integracao CI-friendly com dados sinteticos",
    "local_integration: Testes de integracao local com dados reais (requer Excel)",
    "gpu_required: Testes que requerem GPU CUDA real",
    "slow: Testes lentos (mais de 1 minuto)",
    "unit: Testes unitários puros (sem DB/IO)",
    "security: Testes de segurança (XSS, rate limit, quota, upload, torch)",
    "e2e: Testes end-to-end"
]
