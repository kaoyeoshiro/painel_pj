# =============================================================================
# Portal PGE - Configuracao SonarQube
# =============================================================================
# Documentacao: https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/analysis-parameters/

# --- Identificacao do Projeto ---
sonar.projectKey=portal-pge
sonar.projectName=Portal PGE-MS
sonar.projectVersion=1.0.0

# --- Servidor ---
sonar.host.url=http://localhost:9000

# --- Token (substituir apos gerar no SonarQube) ---
#sonar.token=SEU_TOKEN_AQUI

# --- Encoding ---
sonar.sourceEncoding=UTF-8

# --- Fontes ---
# Backend Python + Frontend React/TS
sonar.sources=main.py,config.py,auth,admin,middleware,database,services,sistemas,utils,models,frontend-react/src

# --- Testes ---
sonar.tests=tests,frontend-react/src
sonar.test.inclusions=**/test_*.py,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# --- Exclusoes globais (nao analisar) ---
sonar.exclusions=\
  **/.venv/**,\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/migrations/**,\
  **/alembic/versions/**,\
  **/.git/**,\
  **/dist/**,\
  **/build/**,\
  **/.vite/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/e2e-artifacts/**,\
  **/logs/**,\
  **/data/**,\
  **/bert_models/**,\
  **/logo/**,\
  **/*.png,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.svg,\
  **/*.ico,\
  **/*.woff,\
  **/*.woff2,\
  **/*.ttf,\
  **/*.eot,\
  **/*.map,\
  **/*.min.js,\
  **/*.min.css,\
  **/portal_pge.egg-info/**,\
  **/tmp_*.py,\
  **/%TEMP%*,\
  **/temp_*.txt,\
  **/scripts/refactor_*.py,\
  **/scripts/validate_*.py,\
  **/scripts/audit_*.py,\
  **/scripts/list_routes.py,\
  **/nul,\
  **/services/shared/example_usage.py,\
  **/services/gemini_service_original.py,\
  **/sistemas/bert_training/static/js/app.js,\
  **/sistemas/bert_training/static/js/**/*.min.js

# --- Python ---
sonar.python.version=3.10
# Cobertura de testes (gerar com: pytest --cov=. --cov-report=xml:coverage.xml)
sonar.python.coverage.reportPaths=coverage.xml

# --- TypeScript/JavaScript ---
# Cobertura frontend (gerar com: cd frontend-react && npx vitest run --coverage)
sonar.javascript.lcov.reportPaths=frontend-react/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend-react/coverage/lcov.info

# --- Duplicacoes ---
# Ignorar duplicacoes em testes
sonar.cpd.exclusions=\
  **/tests/**,\
  **/test_*.py,\
  **/*.test.ts,\
  **/*.test.tsx

# --- Regras customizadas ---
# Desabilitar regras que conflitam com padroes do projeto
# (ajustar conforme necessidade apos primeira analise)

# --- Limites de qualidade (Quality Gate) ---
# Usar o padrao "Sonar way" inicialmente
